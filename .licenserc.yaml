# Apache SkyWalking Eyes reads this. `license-eye header check` verifies the notice every Ruby file in this repository opens with, and `license-eye header fix` writes it into a file which has none.
#
# `license-eye` comes from the devshell rather than the bundle, because it is Go: see the skywalking-eyes entry in flake.nix.
#
# `fix` inserts the notice above `# frozen_string_literal: true` rather than below it, which is not where the other files carry it. So a new file is better served by copying a neighbour, and `check` accepts either order.
header:
  license:
    spdx-id: "Apache-2.0"
    copyright-owner: "General Intelligence Systems"

    # What a file which has no notice is given.
    content: |
      Released under the Apache License, Version 2.0.
      Copyright, 2026, by General Intelligence Systems.

    # What counts as having one already. Wider than `content`, so that a file naming another year, a span of years or another holder still passes.
    pattern: |
      Released under the Apache License, Version 2\.0\.
      Copyright, \d{4}(?:[-,] ?\d{4})*, by .+\.

  # Ruby carries the notice; the shell scripts under bin/ and the Rust sources under ext/ do not. The crate carries its attribution as rustdoc and in NOTICE instead.
  paths:
    - "*.gemspec"
    - "Gemfile"
    - "Rakefile"
    - "bin/release-gem"
    - "ext/**/*.rb"
    - "lib/**/*.rb"
    - "test/**/*.rb"

  # The Ruby entry license-eye ships, plus the extensionless scripts under bin/ which are Ruby too. Declaring a language replaces its entry rather than adding to it, so the defaults this project uses are repeated here.
  language:
    Ruby:
      extensions:
        - ".rb"
        - ".gemspec"
      filenames:
        - "Gemfile"
        - "Rakefile"
        - "release-gem"
      comment_style_id: Hashtag

  comment: never

dependency:
  files:
    - Gemfile.lock
